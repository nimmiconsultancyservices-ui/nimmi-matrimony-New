<!doctype html>

    <meta charset="UTF-8" />

    <title>Nimmi Matrimony — Two Hearts, One Beautiful Journey</title>
    <script>
      (function () {
        try {
          var valid = ['royal-gold', 'peacock-blue', 'rose-romance', 'emerald-green'];
          var stored = window.localStorage.getItem('nimmi_selected_theme');
          if (stored && valid.indexOf(stored) !== -1) {
            document.documentElement.dataset.theme = stored;
          } else {
            document.documentElement.dataset.theme = 'royal-gold';
          }
          var storedLang = window.localStorage.getItem('nimmi_selected_language');
          if (storedLang && typeof storedLang === 'string') {
            document.documentElement.lang = storedLang;
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'royal-gold';
        }
      })();
    </script>
    <meta
      name="description"
